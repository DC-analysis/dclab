name: Checks

on:
  push:
  pull_request:

jobs:
  python-versions:
    # Determine the second-latest stable Python version, because
    # dependencies (e.g. numpy) are often not yet available for the
    # latest version. Falls back to "3.x" if anything goes wrong.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      second-latest: ${{ steps.version.outputs.version }}
    steps:
    - id: version
      run: |
        version=$(curl -sSf --retry 3 --max-time 30 \
          https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json \
          | jq -r '[.[] | select(.stable) | .version | split(".")[:2] | join(".")]
                   | unique_by(split(".") | map(tonumber)) | .[-2]') || true
        if [[ ! "$version" =~ ^3\.[0-9]+$ ]]; then
          echo "::warning::Could not determine second-latest Python version, using 3.x"
          version="3.x"
        fi
        echo "Using Python $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: python-versions
    # Also run if the "python-versions" job failed (falls back to "3.x")
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', "${{ needs.python-versions.outputs.second-latest || '3.x' }}"]
        os: [macos-latest, ubuntu-latest, windows-latest]
        extras: ['all', 'dcor-s3', 'none']
      fail-fast: false
    # The lme4 tests take long (test_glmer_differential ~10 min on Linux)
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@main
      with:
        python-version: ${{ matrix.python-version }}
    # Temporary fix for 'pip install imageio-ffmpeg'
    # not including the FFMPEG binary on Apple Silicon macs
    # This step can be removed when issue is fixed in imageio-ffmpeg
    # https://github.com/imageio/imageio-ffmpeg/issues/71
    - name: Setup FFmpeg
      if: runner.name == 'macos-latest'
      run: |
        brew update
        brew install ffmpeg
    # Temporary fix for 'pip install imageio-ffmpeg'
    # not including the FFMPEG binary on Apple Silicon macs
    # This step can be removed when issue is fixed in imageio-ffmpeg
    # https://github.com/imageio/imageio-ffmpeg/issues/71
    - name: Setup FFmpeg
      if: runner.os == 'macOS'
      uses: AnimMouse/setup-ffmpeg@v1
    - name: Install dependencies
      run: |
        # prerequisites
        python -m pip install --upgrade pip wheel
        python -m pip install coverage flake8 pytest
    - name: install R
      if: matrix.extras == 'all'
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
        # binary R packages on Linux
        use-public-rspm: true
    - name: Install R packages for lme4
      if: matrix.extras == 'all'
      shell: bash
      run: |
        R --version
        # use CRAN mirror from setup-r if available (not set on Windows)
        R -e "if (getOption('repos')[['CRAN']] == '@CRAN@') options(repos='https://cloud.r-project.org'); install.packages(c('statmod','nloptr','lme4'))"
        # fail if lme4 could not be installed (otherwise the lme4 tests
        # are silently skipped)
        R -e "library(lme4); library(nloptr); library(statmod)"
    - name: Install dclab with all possible dependencies
      if: matrix.extras == 'all'
      run: |
        pip install -e .[all]
        pip install -r tests/requirements.txt
    - name: Install dclab with DCOR dependencies
      if: matrix.extras == 'dcor-s3'
      run: |
        pip install -e .[dcor,http,s3]
    - name: Install dclab with minimal dependencies
      if: matrix.extras == 'none'
      run: |
        pip install -e .
    - name: List installed packages
      run: |
        pip freeze
    - name: Lint with flake8
      run: |
        flake8 --exclude _version.py .
    - name: Test with pytest
      run: |
        coverage run --source=dclab -m pytest tests
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      # FIXME Limit runtime until
      # https://github.com/codecov/codecov-action/issues/1316 is resolved
      timeout-minutes: 1
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
