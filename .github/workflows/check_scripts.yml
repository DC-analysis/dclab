name: Checks for scripts

on:
  push:
  pull_request:

jobs:
  python-versions:
    # Determine the second-latest stable Python version, because
    # dependencies (e.g. numpy) are often not yet available for the
    # latest version. Falls back to "3.x" if anything goes wrong.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      second-latest: ${{ steps.version.outputs.version }}
    steps:
    - id: version
      run: |
        version=$(curl -sSf --retry 3 --max-time 30 \
          https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json \
          | jq -r '[.[] | select(.stable) | .version | split(".")[:2] | join(".")]
                   | unique_by(split(".") | map(tonumber)) | .[-2]') || true
        if [[ ! "$version" =~ ^3\.[0-9]+$ ]]; then
          echo "::warning::Could not determine second-latest Python version, using 3.x"
          version="3.x"
        fi
        echo "Using Python $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: python-versions
    # Also run if the "python-versions" job failed (falls back to "3.x")
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["${{ needs.python-versions.outputs.second-latest || '3.x' }}"]
        os: [macos-latest, ubuntu-latest, windows-latest]
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@main
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@main
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # prerequisites
        python -m pip install --upgrade pip wheel
        python -m pip install coverage flake8 pytest
    - name: Install dependencies
      run: |
        pip install -r scripts/requirements.txt
        pip install .
    - name: List installed packages
      run: |
        pip freeze
    - name: Test scripts with pytest
      run: |
        pytest scripts/*.py
      shell: bash
